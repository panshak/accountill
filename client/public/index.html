<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Open Source Invoicing App made using the MERN Stack"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Performance: preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <title>Accountill — Free Invoicing App for Freelancers and Small Businesses</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- App root -->
    <div id="root"></div>

    <!-- Optional: small header with local image (move image into public/) -->
    <header style="position:fixed;top:8px;left:8px;z-index:9999;">
      <img
        src="%PUBLIC_URL%/mern-img.jpg"
        alt="Accountill logo"
        style="width:32px;height:32px;vertical-align:middle"
      />
    </header>

    <!-- The build tool will inject scripts here in production -->
  </body>
</html>
