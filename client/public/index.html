<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="Accountill - Free Open Source Invoicing App (MERN Stack) for freelancers and small businesses" />
    <meta name="keywords" content="invoice, accounting, open source, MERN, freelancer, business, Accountill" />
    <meta name="author" content="Accountill Team" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Accountill - Free Invoicing App for Freelancers and Small Businesses" />
    <meta property="og:description" content="Free and open source invoicing and accounting app for all freelancers and businesses. Try Accountill today!" />
    <meta property="og:image" content="%PUBLIC_URL%/banner.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://accountill.example.com/" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" rel="stylesheet" />
    <!-- Modern CSS Framework for quick theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <title>Accountill - Free Invoicing App for Freelancers and Small Businesses</title>
    <style>
      body {
        background: linear-gradient(120deg, #e3f2fd 0%, #fafafa 100%);
        font-family: 'Roboto', Arial, sans-serif;
        min-height: 100vh;
      }
      #welcome-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
        margin: 0 auto 2rem auto;
        max-width: 600px;
      }
      #welcome-hero img {
        width: 96px;
        height: 96px;
        margin-bottom: 2rem;
      }
      #welcome-hero .display-6 {
        font-weight: 700;
        color: #1976d2;
      }
      #welcome-hero .lead {
        font-weight: 400;
        color: #424242;
      }
      #welcome-hero .btn {
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 500;
        transition: background 0.2s;
      }
      #footer {
        width: 100%;
        padding: 1rem;
        text-align: center;
        color: #888;
        font-size: 0.9rem;
        background: #f5f5f5;
        border-top: 1px solid #ddd;
        position: absolute;
        bottom: 0;
      }
      @media (max-width: 600px) {
        #welcome-hero {
          min-height: 60vh;
          padding: 2rem 1rem;
        }
        #welcome-hero img {
          width: 72px;
          height: 72px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="alert alert-danger m-4" role="alert">
        You need to enable JavaScript to run this app.
      </div>
    </noscript>
    <div id="root"></div>
    <!-- Simple static welcome hero (see below JS note) -->
    <div id="welcome-hero" aria-label="Accountill Dashboard Welcome">
      <img src="%PUBLIC_URL%/logo192.png" alt="Accountill Logo" />
      <h1 class="display-6 mb-3">Welcome to Accountill</h1>
      <p class="lead">Your free, open source invoicing & accounting app for freelancers and small businesses.</p>
      <a href="https://github.com/accountill/accountill" target="_blank" rel="noopener noreferrer" class="btn btn-primary rounded-5 shadow">
        ⭐ View on GitHub
      </a>
    </div>
    <footer id="footer">
      &copy; 2025 Accountill. Powered by MERN Stack. <a href="https://github.com/accountill/accountill" target="_blank" rel="noopener">GitHub</a>
    </footer>
    <!-- Bootstrap JS (optional, if used by your dashboard components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
